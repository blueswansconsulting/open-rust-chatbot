<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sparky follows your cursor</title>
<style>
  :root { --bg: #f5f7fb; --fg: #0A2540; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b1220; --fg: #e6edf7; } }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid; place-items: center; text-align: center;
  }
  .stage { padding: 24px 16px; }
  .mascot { width: min(320px, 70vw); height: auto; display: block; margin: 0 auto 16px; overflow: visible; }
  p { max-width: 34ch; margin: 0 auto; opacity: .8; }
</style>
</head>
<body>
<div class="stage">
  <svg class="mascot" id="sparky" viewBox="0 0 64 64" role="img" aria-label="Sparky, a friendly mascot in a yellow hard hat">
    <circle cx="32" cy="32" r="32" fill="#0A2540"/>
    <circle cx="32" cy="32" r="30.5" fill="none" stroke="#FFC24B" stroke-width="2"/>
    <g id="head">
      <circle cx="32" cy="37" r="19" fill="#fff"/>
      <g id="face">
        <circle cx="20.5" cy="43.5" r="2.4" fill="#FFC24B" opacity=".7"/>
        <circle cx="43.5" cy="43.5" r="2.4" fill="#FFC24B" opacity=".7"/>
        <g id="eyes">
          <ellipse cx="25" cy="37" rx="3.6" ry="4.4" fill="#0A2540"/>
          <ellipse cx="39" cy="37" rx="3.6" ry="4.4" fill="#0A2540"/>
          <circle cx="26.3" cy="35.3" r="1.4" fill="#fff"/>
          <circle cx="40.3" cy="35.3" r="1.4" fill="#fff"/>
        </g>
        <path transform="translate(32 44)" d="M0-.7C-2-2.4-5.4-2.9-7.9-1.4c-1.4.8-2.7.4-3.1-.7.1 3 2.9 4.6 6 3.9 2.2-.5 3.7-1.6 5-2.5 1.3.9 2.8 2 5 2.5 3.1.7 5.9-.9 6-3.9-.4 1.1-1.7 1.5-3.1.7C5.4-2.9 2-2.4 0-.7z" fill="#0A2540"/>
        <path d="M28.6 47.4q3.4 3.4 6.8 0" fill="none" stroke="#0A2540" stroke-width="2.6" stroke-linecap="round"/>
      </g>
      <g id="hat">
        <path d="M13.5 27Q13.5 8 32 8Q50.5 8 50.5 27z" fill="#FFC24B"/>
        <rect x="9" y="25" width="46" height="4.5" rx="2.25" fill="#FFC24B"/>
        <path d="M33.5 10.5L26 20h5l-2 5 9-10h-5z" fill="#0A2540"/>
      </g>
    </g>
  </svg>
  <p>Move your mouse (or drag a finger) around the page. Sparky turns to look at you, like MetaMask's fox.</p>
</div>

<script>
// Head turns toward the pointer: the whole head shifts and tilts a little, and the face shifts a bit
// more than the hat, which fakes a 3D turn. Eased every frame; idles with a gentle bob and blinks.
(function () {
  const svg = document.getElementById("sparky");
  const head = document.getElementById("head");
  const face = document.getElementById("face");
  const hat = document.getElementById("hat");
  const eyes = document.getElementById("eyes");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)");

  let target = { x: 0, y: 0 }, cur = { x: 0, y: 0 };
  let lastMove = 0, blinkUntil = 0, nextBlink = performance.now() + 2500;

  function aim(clientX, clientY) {
    const r = svg.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    // Normalise to -1..1 with a soft limit so far-away pointers don't over-rotate.
    const nx = (clientX - cx) / (window.innerWidth / 2);
    const ny = (clientY - cy) / (window.innerHeight / 2);
    target.x = Math.max(-1, Math.min(1, nx));
    target.y = Math.max(-1, Math.min(1, ny));
    lastMove = performance.now();
  }
  window.addEventListener("pointermove", (e) => aim(e.clientX, e.clientY), { passive: true });
  window.addEventListener("touchmove", (e) => { const t = e.touches[0]; if (t) aim(t.clientX, t.clientY); }, { passive: true });

  function frame(now) {
    if (reduce.matches) { reset(); requestAnimationFrame(frame); return; }
    // Idle: drift back to centre and bob gently.
    if (now - lastMove > 2500) {
      target.x = Math.sin(now / 1800) * 0.25;
      target.y = Math.sin(now / 1300) * 0.12;
    }
    cur.x += (target.x - cur.x) * 0.12;
    cur.y += (target.y - cur.y) * 0.12;

    head.setAttribute("transform", `translate(${cur.x * 1.6} ${cur.y * 1.2}) rotate(${cur.x * 6} 32 37)`);
    face.setAttribute("transform", `translate(${cur.x * 3.2} ${cur.y * 2.6})`);
    hat.setAttribute("transform", `translate(${cur.x * 1.2} ${cur.y * 0.8})`);

    if (now > nextBlink) { blinkUntil = now + 140; nextBlink = now + 3500 + Math.random() * 4000; }
    const blink = now < blinkUntil ? 0.12 : 1;
    eyes.setAttribute("transform", `translate(0 ${37 * (1 - blink)}) scale(1 ${blink})`);
    requestAnimationFrame(frame);
  }
  function reset() {
    for (const el of [head, face, hat, eyes]) el.removeAttribute("transform");
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

[package]
name = "open-rust-chatbot"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Self-hosted AI chatbot widget for any website: one small Rust binary, any OpenAI-compatible model."
license = "MIT"
repository = "https://github.com/blueswansconsulting/open-rust-chatbot"
readme = "README.md"
keywords = ["chatbot", "ai", "chat-widget", "llm", "websocket"]
categories = ["web-programming::websocket", "command-line-utilities"]
publish = false

[dependencies]
async-stream = "0.3"
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
hex = "0.4"
hmac = "0.13"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["rt", "macros", "net", "sync", "time", "signal"] }
tower-http = { version = "0.6", features = ["compression-gzip", "compression-br"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio-tungstenite = "0.26"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
